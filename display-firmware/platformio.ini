[platformio]
default_envs = display_board

[env:display_board]
platform = espressif32 @ 6.4.0
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    +<main.cpp>

[env:display_board_ota]
platform = espressif32 @ 6.4.0
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
upload_protocol = espota
upload_port = captain-display.local
upload_flags =
    --port=3232
    --auth=pinball2026    ; change this before shipping
build_src_filter =
    +<main.cpp>
