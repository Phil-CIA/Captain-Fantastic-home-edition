[platformio]
default_envs = display_board_usb

; ── USB-C / built-in USB-JTAG (recommended) ──────────────────────────────────
[env:display_board_usb]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Adjust COM port for your OS:
;   Windows:  COM3, COM4, etc.
;   Linux:    /dev/ttyACM0
;   macOS:    /dev/cu.usbmodem*
upload_port = COM3
monitor_port = ${this.upload_port}

build_src_filter =
    +<main.cpp>

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; ── External USB-UART adapter (fallback, uses GPIO16/GPIO17) ─────────────────
[env:display_board_uart]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Connect adapter TX→GPIO17, RX→GPIO16.
; Hold BOOT (GPIO9), press RESET, release BOOT before running flash.
upload_port = COM4
monitor_port = ${this.upload_port}

build_src_filter =
    +<main.cpp>

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
