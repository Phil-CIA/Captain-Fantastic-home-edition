[platformio]
default_envs = captain_control

[env]
platform = espressif32 @ 6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit LED Backpack Library
    adafruit/Adafruit BusIO

[env:captain_control]
monitor_port = COM5
upload_port = COM5
build_src_filter =
    +<control_main.cpp>
    +<display/>

[env:captain_control_ota]
platform = espressif32 @ 6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit LED Backpack Library
    adafruit/Adafruit BusIO
upload_protocol = espota
upload_port = captain-v2-control.local
upload_flags =
    --port=3232
    --auth=pinball2026
build_src_filter =
    +<control_main.cpp>
    +<display/>

[env:captain_matrix]
monitor_port = COM5
upload_port = COM5
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCAPTAIN_MATRIX_TEST_SUPPORT=1
build_src_filter =
    +<matrix_main.cpp>
    +<matrix_test_support.cpp>

; ---------------------------------------------------------------------------
; Display-board (SPI slave, ESP32-C6)
; Flash to the display-board ESP32-C6 over USB.
; Edit upload_port to match the COM port assigned to that board.
; ---------------------------------------------------------------------------
[env:captain_display]
platform = espressif32 @ 6.4.0
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_port = COM6
upload_port = COM6
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSPI_HANDSHAKE_DEBUG=1
build_src_filter =
    +<display_main.cpp>
    +<spi_handshake.cpp>

; ---------------------------------------------------------------------------
; Host display-link (SPI master, ESP32-C6)
; Flash to the host ESP32-C6 board that drives the display over the IDC ribbon.
; Edit upload_port to match the COM port assigned to that board.
; ---------------------------------------------------------------------------
[env:captain_host_display]
platform = espressif32 @ 6.4.0
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_port = COM7
upload_port = COM7
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSPI_HANDSHAKE_DEBUG=1
build_src_filter =
    +<host_display_main.cpp>
    +<spi_handshake.cpp>
