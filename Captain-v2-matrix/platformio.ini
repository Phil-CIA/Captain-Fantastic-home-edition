[platformio]
default_envs = captain_matrix_idf

; ──────────────────────────────────────────────────────────────────────────────
; COM PORT SETUP
; If the board does not appear in the serial monitor or upload fails, see:
;   docs/ESP32C6_USB_DRIVER_SETUP.md
;
; To pin a specific port, uncomment and edit the lines below:
;   upload_port = COM5
;   monitor_port = COM5
; Linux/macOS example:
;   upload_port = /dev/ttyUSB0
;   monitor_port = /dev/ttyUSB0
; ──────────────────────────────────────────────────────────────────────────────

[env:captain_matrix_idf]
platform = espressif32 @ 6.7.0
board = esp32-c6-devkitc-1
framework = espidf
upload_protocol = esptool
monitor_speed = 115200
upload_speed = 115200
; Keep DTR/RTS inactive so the ESP32-C6 auto-reset works correctly
monitor_dtr = 0
monitor_rts = 0
platform_packages =
	tool-esptoolpy@~2.41100.0
extra_scripts = pre:pio_idf_env.py

