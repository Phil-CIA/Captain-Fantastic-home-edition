[platformio]
default_envs = combined_rtos

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5

; Build options
build_flags = 
    -DCORE_DEBUG_LEVEL=0

; Only build the new HT16K33 version
build_src_filter = 
    +<pin_test.cpp>

; Library dependencies
lib_deps = 
    adafruit/Adafruit LED Backpack Library
    adafruit/Adafruit BusIO

; Upload options
upload_speed = 921600

; ====================================================================================
; Test Environments
; ====================================================================================

; Combined Test - Non-RTOS simple scanning (CURRENT)
[env:combined_rtos]
platform = espressif32 @ 6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = COM5

; Flash configuration for 4MB ESP32
board_build.flash_mode = dio

; Partition scheme: Custom SPIFFS partition (2.7MB)
board_build.partitions = partitions_custom.csv

build_src_filter =
    +<main_firmware.cpp>
    +<displays.cpp>
    +<w25q64.cpp>
    +<external_flash_ota.cpp>
    +<ota_http_server.cpp>

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps = 
    adafruit/Adafruit LED Backpack Library
    adafruit/Adafruit BusIO
    earlephilhower/ESP8266Audio @ ^1.9.7
    WebServer

upload_speed = 115200

; USB Upload (for final upload with External Flash OTA)
upload_port = COM5

; OTA Upload (disabled - will use web-based OTA after this upload)
; upload_protocol = espota
; upload_port = 192.168.0.198
; upload_flags = 
;     --port=3232
;     --auth=pinball2026







