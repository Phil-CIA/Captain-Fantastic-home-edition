; =============================================================================
; display-firmware/platformio.ini
;
; ESP32-C6 display board — PlatformIO project configuration.
;
; Hardware: custom display board with
;   - ESP32-C6 MCU
;   - ST7796S TFT (480x320, SPI master)
;   - XPT2046 touch (SPI master, shared bus)
;   - SD card (SPI master, shared bus)
;   - IDC-10 host link (SPI slave to captain_control ESP32-C6)
;   - Handshake: GPIO0 (HOST_REQ in), GPIO1 (DISP_READY out)
;
; ⚠️  Before uploading, read display-firmware/FLASHING_NOTES.md.
;     GPIO0 is a strapping pin that must read HIGH at power-on.
;     Disconnect the IDC-10 ribbon before flashing if the host may
;     drive GPIO0 (HOST_REQ) LOW during power-up or reset.
; =============================================================================

[platformio]
default_envs = display_board

; ---------------------------------------------------------------------------
; Shared base settings
; ---------------------------------------------------------------------------
[env]
platform  = espressif32 @ 6.4.0
board     = esp32-c6-devkitc-1
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; ---------------------------------------------------------------------------
; USB (JTAG-CDC) upload — default for development
;
; Most ESP32-C6 devkits expose a USB-JTAG/Serial port on GPIO12/GPIO13
; (USB D-/D+).  This path does NOT require GPIO0 to be held LOW and does
; NOT conflict with the GPIO0/GPIO1 handshake lines.
; ---------------------------------------------------------------------------
[env:display_board]
upload_protocol = esptool
upload_port     = COM3           ; ← change to your USB-CDC port (COMx / /dev/ttyACM0)
monitor_port    = COM3

build_src_filter =
    +<display_main.cpp>
    +<host_link.cpp>

; ---------------------------------------------------------------------------
; UART upload — alternative if USB-JTAG is unavailable
;
; Uses GPIO16 (RX) / GPIO17 (TX) of the ESP32-C6 UART0 boot-loader path.
; GPIO0 must be held LOW (or a BOOT button pressed) to enter download mode.
; Disconnect the IDC-10 ribbon so the host cannot interfere with GPIO0.
; See FLASHING_NOTES.md § "Flashing via UART".
; ---------------------------------------------------------------------------
[env:display_board_uart]
upload_protocol = esptool
upload_port     = COM4           ; ← change to your UART-to-USB adapter port
monitor_port    = COM4
upload_speed    = 460800

build_src_filter =
    +<display_main.cpp>
    +<host_link.cpp>

; ---------------------------------------------------------------------------
; OTA update — once the firmware is running and WiFi is available
; ---------------------------------------------------------------------------
[env:display_board_ota]
upload_protocol = espota
upload_port     = display-board.local    ; ← mDNS hostname or IP address
upload_flags    =
    --port=3232
    --auth=pinball2026

build_src_filter =
    +<display_main.cpp>
    +<host_link.cpp>
