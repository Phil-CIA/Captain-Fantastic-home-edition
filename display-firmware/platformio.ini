; display-firmware/platformio.ini
; ─────────────────────────────────────────────────────────────────────────────
; PlatformIO configuration for the ESP32-C6 display board firmware.
; Board: ESP32-C6 DevKitM Amazon clone ("C6 Mini" / "SuperMini")
;
; Flash via USB-C using the built-in USB-Serial/JTAG peripheral.
; See FLASHING_NOTES.md for GPIO0 boot-safety rules before connecting
; the IDC ribbon cable to the host board.

[platformio]
default_envs = display_board

[env:display_board]
platform          = espressif32 @ 6.4.0
board             = esp32-c6-devkitm-1
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

; USB-JTAG built-in — adjust port as needed
; monitor_port    = /dev/ttyACM0    ; Linux
; upload_port     = /dev/ttyACM0
; monitor_port    = COM5            ; Windows
; upload_port     = COM5

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0

build_src_filter =
    +<main.cpp>

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TFT_eWidget @ ^0.0.5
    hideakitai/ESP32SPISlave @ ^0.4.0
